# AgentD Pipeline Configuration
# Usage: conda run -n agentd python run_agentd.py --config pipeline_config.yaml
run_id: "BCL2_pipeline"
model: "gpt-4o"

protein: "BCL-2"
disease: "chronic lymphocytic leukemia"

# Pipeline parameters
iterations: 2
num_smiles: 2       
run_boltz: false
boltz_top_k: 2
boltz_extra_args_json: '["--use_msa_server","--accelerator","gpu","--num_workers","4"]'

